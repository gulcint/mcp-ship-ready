# Müşteri projesi CI'ı. Stack seçildi: TypeScript (Node native type-stripping,
# bkz. task-2026-09-25-0002 Plan). test-integrity baştan açık, node job'ı
# izole eklendi — birbirine dokunmaz.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash scripts/ci/test-integrity.sh "origin/${{ github.base_ref }}"

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm install -g @anthropic-ai/claude-code@2.1.282
      - run: claude plugin validate .
